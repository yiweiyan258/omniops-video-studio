[package]
name = "omniops-video-studio"
version = "0.4.0"
description = "OmniOps professional video production desktop application"
authors = ["OmniOps"]
edition = "2021"

[[bin]]
name = "omniops-video-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
